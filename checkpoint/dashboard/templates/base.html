<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}checkpoint{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper:#f5f2ea; --paper-2:#ebe7dc; --paper-3:#e0dccf;
      --ink:#0a0a0a; --ink-2:#1f1d18; --ink-3:#5a5648; --ink-4:#8a8472; --ink-5:#b8b2a0;
      --accent:#2dff5c;
      --pass:#0ea83b; --pass-soft:#d6f5dd;
      --fail:#d73838; --fail-soft:#f8dada;
      --warn:#c89124; --warn-soft:#f9ecd0;
      --info:#2a5fb8; --info-soft:#d6e3f4;
      --judge:#7a4ec6; --judge-soft:#e6dbf3;
      --shadow: 6px 6px 0 0 var(--ink);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { background:var(--paper); color:var(--ink); }
    body {
      font-family:'Geist', system-ui, -apple-system, sans-serif;
      font-size:15px; line-height:1.5;
      font-feature-settings:"ss01","ss02","cv11";
      font-variant-numeric:tabular-nums;
      min-height:100vh;
    }
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background: radial-gradient(rgba(10,10,10,0.018) 1px, transparent 1px) 0 0 / 3px 3px;
    }
    .container { max-width:1280px; margin:0 auto; padding:0 32px; position:relative; z-index:1; }
    a { color:var(--ink); text-decoration:none; }
    a.link { border-bottom:1px solid var(--ink-5); }
    a.link:hover { border-bottom-color:var(--ink); }
    code, .mono { font-family:'Geist Mono', ui-monospace, monospace; }

    /* Nav */
    nav.top {
      position:sticky; top:0; z-index:100; height:64px;
      border-bottom:1px solid var(--ink);
      background: rgba(245,242,234,0.85);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    nav.top .inner { display:flex; align-items:center; height:100%; }
    nav.top .brand { font-weight:700; font-size:15px; display:flex; align-items:center; gap:10px; }
    nav.top .brand-dot {
      width:10px; height:10px; background:var(--accent); border:1px solid var(--ink);
      box-shadow:0 0 0 0 rgba(45,255,92,0.5); animation: blip 1.5s ease-in-out infinite;
    }
    @keyframes blip {
      0%,100% { opacity:1; box-shadow:0 0 0 0 rgba(45,255,92,0.5); }
      50%      { opacity:0.6; box-shadow:0 0 0 6px rgba(45,255,92,0); }
    }
    nav.top .links { display:flex; gap:24px; margin-left:48px; flex:1; }
    nav.top .links a {
      font-size:13.5px; font-weight:500; padding:4px 0;
      border-bottom:2px solid transparent;
    }
    nav.top .links a.active { border-bottom-color:var(--ink); }
    nav.top .links a:hover { color:var(--ink-3); }
    nav.top .meta { color:var(--ink-3); font-size:11px;
                    text-transform:uppercase; letter-spacing:0.08em; }

    /* Cards */
    .card {
      border:1px solid var(--ink); background:var(--paper-2);
      box-shadow:var(--shadow); padding:24px;
    }
    .card.flat { box-shadow:none; }
    .card.tight { box-shadow:var(--shadow); padding:0; border:1px solid var(--ink); background:var(--paper-2); }
    .card-title { font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
                  color:var(--ink-3); margin-bottom:12px; font-family:'Geist Mono', monospace; }

    /* Summary stat tiles */
    .stat-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:20px; margin-bottom:32px; }
    .stat-grid .card { padding:20px; }
    .stat-num { font-size:32px; font-weight:600; line-height:1; margin-top:8px;
                font-family:'Geist Mono', monospace; }
    .stat-sub { color:var(--ink-3); font-size:12px; margin-top:8px; }

    /* Tables */
    table { width:100%; border-collapse:collapse; background:var(--paper); }
    th { font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-3);
         border-bottom:1px solid var(--ink); padding:10px 14px; text-align:left;
         font-family:'Geist Mono', monospace; font-weight:500; background:var(--paper-2); }
    td { padding:12px 14px; border-bottom:1px solid var(--paper-3); font-size:13.5px;
         vertical-align:top; }
    tr.row-link { cursor:pointer; }
    tr.row-link:hover td { background:var(--paper-2); }
    td.mono, th.mono { font-family:'Geist Mono', monospace; font-size:12px; }
    .empty-state { text-align:center; padding:48px 24px; color:var(--ink-4); }

    /* Badges */
    .badge { display:inline-block; padding:3px 8px; font-size:10.5px;
             text-transform:uppercase; letter-spacing:0.08em;
             border:1px solid; font-family:'Geist Mono', monospace; font-weight:500; }
    .badge.pass { color:var(--pass); border-color:var(--pass); background:var(--pass-soft); }
    .badge.fail { color:var(--fail); border-color:var(--fail); background:var(--fail-soft); }
    .badge.warn { color:var(--warn); border-color:var(--warn); background:var(--warn-soft); }
    .badge.info { color:var(--info); border-color:var(--info); background:var(--info-soft); }
    .badge.d    { color:var(--ink-3); border-color:var(--ink-5); background:var(--paper-3); }
    .badge.p    { color:var(--judge); border-color:var(--judge); background:var(--judge-soft); }

    /* Score bar */
    .score-bar { display:inline-block; width:64px; height:6px; background:var(--paper-3);
                 border:1px solid var(--ink); vertical-align:middle; }
    .score-bar .fill { height:100%; display:block; }

    /* Page heads */
    .page-title { font-size:28px; font-weight:700; margin-bottom:6px; line-height:1.1; }
    .page-sub { color:var(--ink-3); font-size:14px; margin-bottom:28px; }
    .section-title { font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
                     color:var(--ink-3); margin:32px 0 12px; font-family:'Geist Mono', monospace; }

    /* Forms */
    input[type=text], input[type=search] {
      height:38px; border:1px solid var(--ink); background:var(--paper);
      padding:0 12px; font-family:'Geist', sans-serif; font-size:13.5px;
      color:var(--ink); outline:none;
    }
    input[type=text]:focus, input[type=search]:focus { box-shadow:3px 3px 0 0 var(--accent); }
    .btn { height:38px; padding:0 16px; border:1px solid var(--ink); background:var(--ink);
           color:var(--paper); font-family:'Geist', sans-serif; font-size:13.5px;
           cursor:pointer; font-weight:500; display:inline-flex; align-items:center; gap:6px;
           text-decoration:none; }
    .btn:hover { background:#1a1a1a; }
    .btn.outline { background:transparent; color:var(--ink); }
    .btn.outline:hover { background:var(--ink); color:var(--paper); }
    .btn.ghost { border:none; background:transparent; color:var(--ink-2); padding:0 8px; }
    .filter-row { display:flex; gap:8px; align-items:center; margin-bottom:24px; }

    /* Collapsible */
    details { border-top:1px solid var(--paper-3); }
    details summary { cursor:pointer; padding:12px 0; font-size:13.5px; font-weight:500;
                      list-style:none; user-select:none; }
    details summary::-webkit-details-marker { display:none; }
    details summary::before { content:'+ '; color:var(--ink-3); font-family:'Geist Mono', monospace; }
    details[open] summary::before { content:'- '; }

    /* JSON viewer */
    pre.json {
      font-family:'Geist Mono', monospace; font-size:12px; line-height:1.5;
      background:var(--paper); border:1px solid var(--paper-3); padding:14px;
      overflow-x:auto; max-height:480px; overflow-y:auto;
      white-space:pre; color:var(--ink-2);
    }

    /* Kind pills */
    .kind-d, .kind-p { display:inline-block; min-width:18px; padding:1px 4px; font-size:10px;
                       font-family:'Geist Mono', monospace; font-weight:600;
                       border:1px solid; text-align:center; }
    .kind-d { color:var(--ink); border-color:var(--ink); background:var(--paper-3); }
    .kind-p { color:var(--judge); border-color:var(--judge); background:var(--judge-soft); }

    /* Sparkline */
    .sparkline { display:flex; align-items:flex-end; gap:2px; height:48px; margin:8px 0; }
    .sparkline .bar { flex:1; min-width:4px; border:1px solid var(--ink); }

    /* Trace event */
    .trace-event { display:grid; grid-template-columns: 60px 1fr 60px 90px;
                   gap:12px; padding:6px 0; font-size:12px; font-family:'Geist Mono', monospace;
                   border-bottom:1px solid var(--paper-3); }
    .trace-event .method { font-weight:600; }
    .trace-event .status-2 { color:var(--pass); }
    .trace-event .status-4, .trace-event .status-5 { color:var(--fail); }

    /* Footer */
    footer { margin-top:80px; padding:24px 0 40px; border-top:1px solid var(--paper-3);
             color:var(--ink-3); font-size:11px; text-transform:uppercase;
             letter-spacing:0.08em; font-family:'Geist Mono', monospace; }

    /* Live indicator */
    .live-dot { display:inline-block; width:8px; height:8px; background:var(--accent);
                border:1px solid var(--ink); animation: blip 1.5s ease-in-out infinite;
                margin-right:6px; vertical-align:middle; }

    /* Side-by-side compare */
    .compare-grid { display:grid; grid-template-columns: 1fr 1fr; gap:24px; }
    .compare-grid .pane { padding:20px; }
    .delta { font-family:'Geist Mono', monospace; font-weight:600; font-size:18px; }
    .delta.up   { color:var(--pass); }
    .delta.down { color:var(--fail); }
    .delta.flat { color:var(--ink-3); }

    /* Pagination */
    .pager { display:flex; justify-content:space-between; align-items:center; margin-top:16px;
             color:var(--ink-3); font-size:12px; }
    .pager .links a { padding:4px 10px; border:1px solid var(--ink-5); margin-left:6px; }
    .pager .links a:hover { border-color:var(--ink); background:var(--paper-2); }

    /* Micro text */
    .micro { font-size:11px; color:var(--ink-4); }

    /* Responsive */
    @media (max-width: 900px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .compare-grid { grid-template-columns: 1fr; }
      nav.top .links { gap:16px; margin-left:24px; }
    }
  </style>
</head>
<body>
  <nav class="top">
    <div class="container inner">
      <div class="brand"><span class="brand-dot"></span><span>checkpoint</span></div>
      <div class="links">
        <a href="/"          {% if active=='runs' %}class="active"{% endif %}>Runs</a>
        <a href="/scenarios" {% if active=='scenarios' %}class="active"{% endif %}>Scenarios</a>
        <a href="/report"    {% if active=='report' %}class="active"{% endif %}>Report</a>
      </div>
      <div class="meta">local &middot; {{ host or '127.0.0.1' }}</div>
    </div>
  </nav>
  <div class="container" style="padding-top:40px; padding-bottom:80px;">
    {% block content %}{% endblock %}
  </div>
  <footer><div class="container">checkpoint dashboard &middot; v{{ version }}</div></footer>
</body>
</html>
