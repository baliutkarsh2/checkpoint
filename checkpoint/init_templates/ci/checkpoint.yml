# Gate every pull request on what the agent actually does.
#
# The gate runs each scenario several times and decides from the pass-rate
# distribution, so a lucky run cannot ship a broken agent. Only SHIP exits 0.
name: checkpoint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Checkpoint
        run: pip install checkpoint-agents

      # Pass rates are remembered in .checkpoint/baselines.json and only a SHIP
      # updates them, which is what turns "this used to pass" into a reported
      # regression. A fresh runner has no history, so carry it between runs.
      - name: Restore pass-rate baselines
        uses: actions/cache@v4
        with:
          path: .checkpoint/baselines.json
          key: checkpoint-baselines-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            checkpoint-baselines-${{ github.ref_name }}-
            checkpoint-baselines-main-

      - name: Gate
        run: checkpoint gate --certificate checkpoint-certificate.json
        env:
          # Only needed for [P] criteria, which are judged by a model.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Kept even when the gate blocks: the failing evidence is the useful kind.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-evidence
          path: |
            checkpoint-certificate.json
            .checkpoint/cache/runs/
          retention-days: 30
