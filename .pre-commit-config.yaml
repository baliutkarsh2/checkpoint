# Optional but recommended: `pip install pre-commit && pre-commit install`
# runs the same lint gate CI enforces, before the commit rather than after.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        # checkpoint/twins/linear_schema.graphql is ~1292 KB, over the ceiling
        # above, and already committed. It is Linear's own published GraphQL
        # SDL, vendored so the Linear twin can answer the same queries the real
        # API does — Linear ships no REST API, so every official client speaks
        # GraphQL and the twin has to serve the real schema to be worth
        # anything. This hook only inspects files being ADDED, so it passes
        # today while the tree contradicts the limit it states.
        #
        # Named exclusion rather than a higher --maxkb: raising the ceiling to
        # fit this one reviewed file would silently license every future 1.3 MB
        # blob, which is the accident the hook exists to catch. Excluding the
        # exact path keeps 1024 KB binding on everything else and leaves the
        # exception written down where the next person can find it.
        exclude: ^checkpoint/twins/linear_schema\.graphql$
      - id: detect-private-key
