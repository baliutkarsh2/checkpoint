name: Release to PyPI

# Publishes checkpoint-agents to PyPI via Trusted Publishing (OIDC) when a
# version tag is pushed. NO API token is stored — PyPI must be configured to
# trust this repo + workflow (see below), then push a tag:  git tag v0.1.0 &&
# git push origin v0.1.0
#
# One-time PyPI setup (done by a maintainer, cannot be scripted):
#   1. Create the project owner account on https://pypi.org.
#   2. PyPI → the `checkpoint-agents` project → Publishing → Add a trusted
#      publisher: owner=baliutkarsh2, repo=checkpoint, workflow=release.yml,
#      environment=pypi. (For the very first release use "pending publisher".)
#   3. Optionally do a dry run against TestPyPI first with a `v*rc*` tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: checkpoint/dashboard/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      # The dashboard SPA bundle is NOT committed (it is gitignored). Build it
      # here from source so `python -m build` picks it up as package-data; the
      # wheel check below fails the release if the bundle is missing.
      - name: Build dashboard SPA
        working-directory: checkpoint/dashboard/web
        run: |
          npm ci
          npm run build

      # Never publish an artifact whose tests were not run on the tagged commit.
      # A tag must publish the version it names. Without this, `git tag v0.2.0`
      # would happily ship whatever version the package currently declares.
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -m pip install --upgrade setuptools wheel
          PKG=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('checkpoint/__init__.py').read_text()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match checkpoint.__version__ ($PKG)"
            exit 1
          fi

      - name: Run the test suite on the tagged commit
        run: |
          python -m pip install -e ".[dev]"
          pytest tests/ -q

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      # Guard the published artifact: everything read at runtime must be inside
      # the wheel, or `pip install checkpoint-agents` ships a broken package.
      - name: Verify the wheel ships all runtime assets
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()

          def need(pred, what):
              if not any(pred(n) for n in names):
                  sys.exit(f"FAIL: {whl} is missing {what}")
              print("OK:", what)

          need(lambda n: "dashboard/static/index.html" in n, "the SPA bundle")
          need(lambda n: "demo/smoke-scenario.md" in n, "the demo scenario")
          need(lambda n: "demo/harness_fake.py" in n, "the demo harness")
          need(lambda n: "proxy/Dockerfile" in n, "the TLS sidecar Dockerfile")

          seeds = [n for n in names if "_seeds/" in n and n.endswith(".json")]
          if len(seeds) < 20:
              sys.exit(f"FAIL: {whl} ships only {len(seeds)} twin seed files")
          print(f"OK: {len(seeds)} twin seed fixtures")

          bad = [n for n in names if "__pycache__" in n or n.endswith((".pyc", ".pyo"))]
          if bad:
              sys.exit(f"FAIL: {whl} ships bytecode: {bad[:5]}")
          print("OK: no bytecode in the wheel")
          print("release wheel verified:", whl)
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    # Publish ONLY from a version tag. Without this, a workflow_dispatch run on
    # any branch would ship that branch's content to PyPI under a real version.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 provenance: signed proof the artifact came from this
          # workflow in this repo, verifiable by installers.
          attestations: true
