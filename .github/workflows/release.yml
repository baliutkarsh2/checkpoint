name: Release to PyPI

# Publishes checkpoint-agents to PyPI via Trusted Publishing (OIDC) when a
# version tag is pushed. NO API token is stored — PyPI must be configured to
# trust this repo + workflow (see below), then push a tag:  git tag v0.1.0 &&
# git push origin v0.1.0
#
# One-time PyPI setup (done by a maintainer, cannot be scripted):
#   1. Create the project owner account on https://pypi.org.
#   2. PyPI → the `checkpoint-agents` project → Publishing → Add a trusted
#      publisher: owner=Aaditya2605, repo=checkpoint, workflow=release.yml,
#      environment=pypi. (For the very first release use "pending publisher".)
#   3. Optionally do a dry run against TestPyPI first with a `v*rc*` tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The dashboard SPA bundle is committed under checkpoint/dashboard/static
      # and shipped via package-data, so no Node build is needed here.
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Verify the wheel ships the SPA bundle
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()
          assert any("dashboard/static/index.html" in n for n in names), "SPA bundle missing"
          print("OK:", whl)
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
