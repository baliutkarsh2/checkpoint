name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history on push)
        uses: actions/checkout@v7
        with:
          # Scan the whole history on push so a secret buried in an older commit
          # is still caught; PRs scan just the diff range gitleaks selects.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Run gitleaks
        # BLOCKING. This repo's history was published with the old `.env` blob
        # already purged (git filter-repo), so the full-history scan is clean and
        # a secret in any commit — new or old — must fail the build.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
