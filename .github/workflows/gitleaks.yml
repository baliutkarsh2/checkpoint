name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history in BOTH events. On push this catches a secret buried in
          # an older commit; on pull_request gitleaks resolves a base^..head
          # range, which a shallow clone cannot provide (it fails with
          # "unknown revision" rather than reporting a clean scan).
          fetch-depth: 0

      - name: Run gitleaks
        # BLOCKING. This repo's history was published with the old `.env` blob
        # already purged (git filter-repo), so the full-history scan is clean and
        # a secret in any commit — new or old — must fail the build.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required for PR scans: the action diffs the PR via the API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
