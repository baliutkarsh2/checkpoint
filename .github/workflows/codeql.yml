name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "27 3 * * 1" # weekly, Monday 03:27 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        # The SARIF upload needs GitHub code scanning enabled, which a PRIVATE
        # repo requires GitHub Advanced Security for. It's free once this repo is
        # public (open-core), at which point this uploads cleanly. Until then,
        # don't let the upload block CI — the analysis still runs.
        # Removal is step 5 of docs/releasing.md.
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
