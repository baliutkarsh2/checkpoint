name: Checkpoint Agent Eval

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Path to a single scenario file (leave empty to run all)"
        required: false
        default: ""
      clone:
        description: "Override clone (e.g. linear, supabase, github)"
        required: false
        default: ""

jobs:
  eval:
    name: Run checkpoint scenarios
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install checkpoint and dependencies
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e .

      # Detect whether the repo has an OPENAI_API_KEY secret configured.
      # Fork PRs and repos that haven't set the secret will skip the LLM-
      # dependent steps below cleanly instead of failing the whole workflow.
      - name: Check for OPENAI_API_KEY
        id: api_key_check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY secret not set; skipping LLM-judged scenario run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run checkpoint doctor
        if: steps.api_key_check.outputs.skip != 'true'
        run: checkpoint doctor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run scenario against a bundled example agent (Docker mode)
        if: steps.api_key_check.outputs.skip != 'true'
        run: |
          # GitHub-hosted ubuntu runners ship a working Docker daemon, so this
          # exercises the real out-of-the-box path: the TLS sidecar image
          # auto-builds, the example agent runs unmodified against the twins,
          # and checkpoint injects the per-clone bootstrap tokens itself (no
          # manual token env needed). A single cheap scenario keeps CI fast.
          SCENARIO="${{ github.event.inputs.scenario }}"
          if [ -z "$SCENARIO" ]; then
            SCENARIO="scenarios/github-happy-path.md"
          fi
          checkpoint run "$SCENARIO" \
            --harness-dir examples/agents/openai-tools \
            --docker-logs \
            --trace-out ci-traces.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload trace artifact
        if: always() && steps.api_key_check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: checkpoint-traces-${{ github.run_id }}
          path: ci-traces.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload run records
        if: always() && steps.api_key_check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: checkpoint-run-records-${{ github.run_id }}
          path: .checkpoint/cache/runs/
          retention-days: 30
          if-no-files-found: ignore

  build-and-test:
    name: Build SPA + run pytest + verify wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: checkpoint/dashboard/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # 1. Build the SPA from source. The bundle is NOT committed
      # (checkpoint/dashboard/static/ is gitignored); it is produced here and
      # packaged into the wheel by the "Build sdist + wheel" step below, so the
      # published artifact always ships a fresh dashboard built on this runner.
      - name: Build dashboard SPA
        working-directory: checkpoint/dashboard/web
        run: |
          npm ci
          npm run build

      # 1b. Render smoke test: serve the freshly built bundle headlessly and
      # assert it mounts, routes, and is styled by Tailwind. This is the
      # automated stand-in for a manual click-through of UI-framework upgrades.
      - name: Dashboard render smoke test (Playwright)
        working-directory: checkpoint/dashboard/web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      # 2. Install Python deps + run the full pytest suite.
      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -q

      # 3. Build sdist + wheel and prove the SPA is inside.
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      # Every asset the package reads at RUNTIME must be inside the wheel, or a
      # pip-only install breaks in ways no source-checkout test can catch (the
      # twin seeds regressed exactly this way: `seed: small-project` 404s).
      - name: Verify wheel ships all runtime assets
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()

          def need(pred, what):
              if not any(pred(n) for n in names):
                  sys.exit(f"FAIL: {whl} is missing {what}")
              print("OK:", what)

          need(lambda n: "dashboard/static/index.html" in n, "the SPA bundle")
          need(lambda n: "demo/smoke-scenario.md" in n, "the demo scenario")
          need(lambda n: "demo/harness_fake.py" in n, "the demo harness")
          need(lambda n: "proxy/Dockerfile" in n, "the TLS sidecar Dockerfile")
          need(lambda n: "init_templates" in n, "the init templates")

          seeds = [n for n in names if "_seeds/" in n and n.endswith(".json")]
          if len(seeds) < 20:
              sys.exit(f"FAIL: {whl} ships only {len(seeds)} twin seed files")
          print(f"OK: {len(seeds)} twin seed fixtures")
          print("wheel verified:", whl)
          PY

      - name: Upload built distributions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkpoint-dist-${{ github.run_id }}
          path: dist/*
          retention-days: 14

  # The GitHub Action is the README's headline CI integration, so it must be
  # exercised for real — not just linted. This runs it against the bundled demo
  # scenario, which needs no Docker and no API key, and asserts the verdict
  # output. It catches flag drift between action.yml and `checkpoint gate`.
  action:
    name: Validate the GitHub Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install THIS checkout so the action validates the code in the PR; the
      # action's install step then defers to the checkpoint already on PATH.
      - name: Install checkpoint from source
        run: pip install -e .

      - name: Run the action against the bundled demo scenario
        id: gate
        uses: ./
        with:
          target: checkpoint/demo/smoke-scenario.md
          harness: python -m checkpoint.demo.harness_fake
          runs: "3"
          pass-threshold: "80"

      - name: Assert the action reported a verdict
        run: |
          echo "verdict=${{ steps.gate.outputs.verdict }}"
          case "${{ steps.gate.outputs.verdict }}" in
            SHIP|CONDITIONAL|BLOCK) echo "OK: action produced a valid verdict" ;;
            *) echo "FAIL: action did not report a verdict"; exit 1 ;;
          esac
