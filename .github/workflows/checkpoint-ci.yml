name: CI

on:
  push:
    branches: [main, master]
  # Every pull request, not only the ones targeting main: a stacked branch that
  # merges into another feature branch used to reach main having never run CI.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pushing three times to a branch queued three full matrix runs, and the answer
# anyone wanted was the last one. Superseded runs are cancelled on a pull
# request; a push to main is left alone, because that is the run a release is
# read from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The package advertises 3.11/3.12/3.13, so all three must actually run the
  # suite. Deliberately lean: no SPA build, no Playwright, no wheel check —
  # those are Python-version-independent packaging concerns already covered by
  # build-and-test, and conditioning them per-leg would break the wheel step.
  # Note the legs really do differ: the intercept proxy (checkpoint/proxy)
  # drives TLS and sockets through the stdlib's ssl and asyncio directly, and
  # asyncio's server-shutdown semantics changed in 3.12.
  pytest-matrix:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -q

  # Each twin must answer the calls real agents make through the vendor's own
  # SDK; a twin bug fails a correct agent and reads as an agent regression.
  twin-conformance:
    name: Twin conformance (official SDKs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and vendor SDKs
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --group twin-conformance

      # Linear ships no Python SDK, so its conformance test drives the twin with
      # the official TypeScript client through the runner's Node.
      - name: Install @linear/sdk
        run: npm install --no-audit --no-fund @linear/sdk

      - name: Run conformance suite
        env:
          CHECKPOINT_LINEAR_SDK_DIR: ${{ github.workspace }}
        run: pytest tests/sdk -m sdk -q

  # The dashboard image backs three documented deployment paths, and nothing
  # else builds it — a broken base image or dependency conflict would ship
  # undetected. Build only; no registry credentials needed.
  docker-build:
    name: Build the dashboard image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the runtime image
        run: docker build -f Dockerfile -t checkpoint:ci .

  # Fast feedback: a lint failure should not wait behind the full build.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install "ruff>=0.6"

      - name: ruff check
        run: ruff check --output-format=github checkpoint/ tests/

  # Checkpoint, gating Checkpoint's own agent. Every criterion in the demo
  # scenario is decided by an assertion, so this needs no API key and runs on
  # fork pull requests too: if the product stops working end to end — twins,
  # interception, scoring, the verdict, the signature — this is the job that
  # says so, and it is the same command a user runs.
  self-gate:
    name: Gate the bundled agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install checkpoint
        run: pip install -e .

      - name: Check the environment
        run: checkpoint doctor

      # 16 runs is the fewest that can reach SHIP at the default thresholds;
      # anything less would only be testing the gate's refusal to decide.
      # No baseline: a fresh runner has no history, and inventing one here
      # would make the first real regression look like the normal state.
      - name: Gate
        run: |
          checkpoint gate checkpoint/demo/smoke-scenario.md             --command "python -m checkpoint.demo.harness_fake"             --runs 16 --no-baseline             --certificate checkpoint-certificate.json

      - name: Verify the certificate it issued
        run: checkpoint cert verify checkpoint-certificate.json

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checkpoint-evidence-${{ github.run_id }}
          path: |
            checkpoint-certificate.json
            .checkpoint/cache/runs/
          retention-days: 30
          if-no-files-found: ignore

  build-and-test:
    name: Build SPA + run pytest + verify wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: checkpoint/dashboard/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      # 1. Build the SPA from source, so the wheel ships a bundle built here.
      - name: Build dashboard SPA
        working-directory: checkpoint/dashboard/web
        run: |
          npm ci
          npm run build

      # The built bundle is committed so `pip install` from git (and any source
      # checkout) has a working dashboard without needing Node. Diffing the
      # rebuilt output against it does not work — the bundler is not
      # byte-reproducible across operating systems and Node majors, so a correct
      # bundle built on a laptop fails on this runner. What has to be true is
      # narrower: nobody changed the SPA source and forgot to rebuild. The build
      # stamps a hash of its inputs beside the output; recompute and compare.
      - name: Verify the committed SPA bundle is current
        working-directory: checkpoint/dashboard/web
        run: |
          committed=$(cat ../static/.source-hash)
          npm run --silent stamp
          rebuilt=$(cat ../static/.source-hash)
          if [ "$committed" != "$rebuilt" ]; then
            echo "::error::The SPA source changed but checkpoint/dashboard/static/ was not rebuilt."
            echo "Rebuild and commit it:"
            echo "  cd checkpoint/dashboard/web && npm ci && npm run build"
            exit 1
          fi
          echo "OK: the committed bundle was built from this source"

      # 1b. Render smoke test: serve the freshly built bundle headlessly and
      # assert it mounts, routes, and is styled by Tailwind. This is the
      # automated stand-in for a manual click-through of UI-framework upgrades.
      - name: Dashboard render smoke test (Playwright)
        working-directory: checkpoint/dashboard/web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      # 2. Install Python deps + run the full pytest suite.
      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: pytest tests/ -q --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml
          retention-days: 14

      # 3. Build sdist + wheel and prove the SPA is inside.
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      # Every asset the package reads at RUNTIME must be inside the wheel, or a
      # pip-only install breaks in ways no source-checkout test can catch (the
      # twin seeds regressed exactly this way: `seed: small-project` 404s).
      - name: Verify wheel ships all runtime assets
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()

          def need(pred, what):
              if not any(pred(n) for n in names):
                  sys.exit(f"FAIL: {whl} is missing {what}")
              print("OK:", what)

          need(lambda n: "dashboard/static/index.html" in n, "the SPA bundle")
          need(lambda n: "demo/smoke-scenario.md" in n, "the demo scenario")
          need(lambda n: "demo/harness_fake.py" in n, "the demo agent")
          need(lambda n: "init_templates" in n, "the init templates")
          need(lambda n: n.endswith("twins/linear_schema.graphql"),
               "Linear's vendored GraphQL schema")

          seeds = [n for n in names if "_seeds/" in n and n.endswith(".json")]
          if len(seeds) < 20:
              sys.exit(f"FAIL: {whl} ships only {len(seeds)} twin seed files")
          print(f"OK: {len(seeds)} twin seed fixtures")

          bad = [n for n in names if "__pycache__" in n or n.endswith((".pyc", ".pyo"))]
          if bad:
              sys.exit(f"FAIL: {whl} ships bytecode: {bad[:5]}")
          print("OK: no bytecode in the wheel")
          print("wheel verified:", whl)
          PY

      - name: Upload built distributions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checkpoint-dist-${{ github.run_id }}
          path: dist/*
          retention-days: 14

  # The GitHub Action is the README's headline CI integration, so it must be
  # exercised for real — not just linted. This runs it against the bundled demo
  # scenario, which needs no Docker and no API key, and asserts the verdict
  # output. It catches flag drift between action.yml and `checkpoint gate`.
  action:
    name: Validate the GitHub Action
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      # Install THIS checkout so the action validates the code in the PR; the
      # action's install step then defers to the checkpoint already on PATH.
      - name: Install checkpoint from source
        run: pip install -e .

      - name: Run the action against the bundled demo scenario
        id: gate
        uses: ./
        with:
          target: checkpoint/demo/smoke-scenario.md
          command: python -m checkpoint.demo.harness_fake
          # SHIP needs ceil(ship_min*z^2/(1-ship_min)) = 16 clean runs at the
          # default ship_min 0.80; fewer is INCONCLUSIVE and fails the step, so
          # a smaller number here would test nothing but the gate's refusal.
          runs: "16"
          pass-threshold: "80"

      - name: Assert the action reported a verdict
        run: |
          echo "verdict=${{ steps.gate.outputs.verdict }}"
          case "${{ steps.gate.outputs.verdict }}" in
            SHIP|CONDITIONAL|INCONCLUSIVE|BLOCK|ERROR) echo "OK: action produced a valid verdict" ;;
            *) echo "FAIL: action did not report a verdict"; exit 1 ;;
          esac
