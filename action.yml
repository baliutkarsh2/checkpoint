name: "Checkpoint Agent Gate"
description: "Statistically gate an AI agent in CI — run each scenario N times and return SHIP / CONDITIONAL / INCONCLUSIVE / BLOCK / ERROR (only SHIP passes the build)."
author: "Checkpoint"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  target:
    description: "Scenario file or directory to gate."
    required: false
    default: "scenarios/"
  harness:
    description: "Command that runs your agent, e.g. 'python my_agent.py'."
    required: true
  runs:
    description: "Runs per scenario."
    required: false
    default: "20"
  pass-threshold:
    description: "Score (0-100) a single run needs to count as a pass."
    required: false
    default: "80"
  allow-conditional:
    description: "Pass the build on CONDITIONAL (flaky but not failing). Never covers INCONCLUSIVE, BLOCK or ERROR."
    required: false
    default: "false"
  strict:
    description: "Refuse CONDITIONAL even when allow-conditional is set. Already the default; use it to tighten a shared config."
    required: false
    default: "false"
  certificate:
    description: "Path to write a signed Trust Certificate (optional)."
    required: false
    default: ""
  judge-model:
    description: "Model for [P] LLM-judged criteria (needs the matching API key in env)."
    required: false
    default: ""
  agent:
    description: "Agent name recorded in the Trust Certificate. Defaults to the target path's stem."
    required: false
    default: ""
  version:
    description: "checkpoint-agents version spec to install, e.g. '==0.1.0'. Empty installs the latest."
    required: false
    default: ""
  python-version:
    description: "Python version to set up. Leave empty (default) to use the job's existing Python, so the action does not change the interpreter your harness runs under."
    required: false
    default: ""

outputs:
  verdict:
    description: "SHIP, CONDITIONAL, INCONCLUSIVE, BLOCK, or ERROR."
    value: ${{ steps.gate.outputs.verdict }}

runs:
  using: composite
  steps:
    # Only set up Python when the caller asks for a specific version: this step
    # prepends its toolcache to PATH for the whole job, which would otherwise
    # silently change the interpreter the user's own harness runs under.
    - name: Set up Python
      if: inputs.python-version != ''
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install checkpoint
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # Respect a checkpoint the job already installed (lets a caller pin a
        # build, and lets this repo test the action against its own checkout).
        if [ -z "$VERSION" ] && command -v checkpoint >/dev/null 2>&1; then
          echo "Using the checkpoint already on PATH: $(checkpoint --version)"
          exit 0
        fi
        # Prefer the published distribution; fall back to installing from source
        # so the action works before the first PyPI release lands.
        if ! python -m pip install --upgrade "checkpoint-agents${VERSION}"; then
          echo "checkpoint-agents${VERSION} not available on PyPI — installing from source."
          # Pin the fallback to the ref the caller pinned the action to, so a
          # consumer never silently installs whatever is on trunk. Falls back to
          # a released tag rather than HEAD. Remove this branch entirely once the
          # distribution is on PyPI (docs/releasing.md step 7).
          python -m pip install --upgrade "git+https://github.com/baliutkarsh2/checkpoint@${GITHUB_ACTION_REF:-v0.1.0}"
        fi

    - name: Run the gate
      id: gate
      shell: bash
      # Inputs are passed as environment variables, never interpolated into the
      # script body: `${{ }}` is textually pasted before bash parses the script,
      # so a value containing $(...), a quote, or a newline would execute on the
      # runner — and a legitimately quoted harness command would be mangled.
      env:
        TARGET: ${{ inputs.target }}
        HARNESS: ${{ inputs.harness }}
        RUNS: ${{ inputs.runs }}
        PASS_THRESHOLD: ${{ inputs.pass-threshold }}
        ALLOW_CONDITIONAL: ${{ inputs.allow-conditional }}
        STRICT: ${{ inputs.strict }}
        CERTIFICATE: ${{ inputs.certificate }}
        JUDGE_MODEL: ${{ inputs.judge-model }}
        AGENT: ${{ inputs.agent }}
      run: |
        args=(--harness "$HARNESS" -n "$RUNS" --pass-threshold "$PASS_THRESHOLD" -o json)
        # Baselines live in .checkpoint/baselines.json, keyed by the target's
        # path relative to the workspace — restore that file with actions/cache
        # (or commit it) to get regression detection in CI. Left off here because
        # a fresh runner has no history to compare against.
        args+=(--no-baseline)
        if [ "$ALLOW_CONDITIONAL" = "true" ]; then args+=(--allow-conditional); fi
        if [ "$STRICT" = "true" ]; then args+=(--strict); fi
        if [ -n "$CERTIFICATE" ]; then
          mkdir -p "$(dirname "$CERTIFICATE")"
          args+=(--certificate "$CERTIFICATE")
        fi
        if [ -n "$JUDGE_MODEL" ]; then args+=(--judge-model "$JUDGE_MODEL"); fi
        if [ -n "$AGENT" ]; then args+=(--agent "$AGENT"); fi

        # The gate's exit code fails the build: only SHIP is 0 (BLOCK 1,
        # CONDITIONAL 2, INCONCLUSIVE 3, ERROR 4). Capture stdout to a file so
        # the verdict can still be published as a step output on the failing path.
        set +e
        checkpoint gate "$TARGET" "${args[@]}" > checkpoint-gate.json
        code=$?
        set -e
        cat checkpoint-gate.json
        verdict=$(python -c "import json;print(json.load(open('checkpoint-gate.json')).get('verdict','UNKNOWN'))" 2>/dev/null || echo UNKNOWN)
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "Checkpoint verdict: $verdict"
        exit $code
