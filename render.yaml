# Render.com Blueprint — one-click deploy.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. Go to https://render.com/deploy and select your repo (or use the
#      "Deploy to Render" button in docs/self-hosting.md).
#   3. CHECKPOINT_DASHBOARD_API_KEY is generated for you below. It is
#      required, not advisory: this service binds 0.0.0.0 and `checkpoint
#      view` refuses to start off loopback without it. Set OPENAI_API_KEY in
#      the Environment tab only if you judge [P] criteria here.
#
# What you get: a Render web service backed by a 1 GB persistent disk,
# auto-deployed on every push to main.

services:
  - type: web
    name: checkpoint-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter             # bump to "standard" for production traffic
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4001
      - key: CHECKPOINT_HOME
        value: /data/config
      - key: CHECKPOINT_LOG_LEVEL
        value: INFO
      - key: OPENAI_API_KEY
        sync: false           # set in the Render dashboard, not in the file
      - key: CHECKPOINT_DASHBOARD_API_KEY
        generateValue: true   # Render auto-generates a strong secret
    disk:
      name: checkpoint-data
      mountPath: /data
      sizeGB: 1
