[project]
name = "checkpoint-agents"
dynamic = ["version"]
description = "The pre-production release gate for AI agents: simulate against stateful SaaS twins, score full trajectories, gate every build."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Checkpoint Labs", email = "hello@usecheckpoint.dev" }]
keywords = ["ai", "agents", "testing", "evaluation", "llm", "red-teaming", "ci", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
# No speculative upper bounds. An upper bound in a published library propagates
# into every downstream resolver and can make this package uninstallable
# alongside a newer release of a shared dependency — the cost lands on users,
# not on us. Compatibility is proven by testing instead: CI resolves the latest
# of everything on Python 3.11/3.12/3.13 and builds both container images, so a
# genuinely breaking major fails the build rather than silently reaching anyone.
# Floors are real requirements, not guesses (uvicorn matches mcp's own floor).
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.31.1",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "openai>=1.30",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "mitmproxy>=10.0",
    "docker>=7.0",
    "mcp>=1.27",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]
# Judge/parse with Claude models (claude-*). Gemini (gemini-*) and any
# OpenAI-compatible endpoint need no extra — they reuse the OpenAI client.
anthropic = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://usecheckpoint.dev"
Repository = "https://github.com/baliutkarsh2/checkpoint"
Documentation = "https://usecheckpoint.dev/docs"
Issues = "https://github.com/baliutkarsh2/checkpoint/issues"
Changelog = "https://github.com/baliutkarsh2/checkpoint/blob/main/CHANGELOG.md"

[project.scripts]
checkpoint = "checkpoint.cli:main"

[project.entry-points."pytest11"]
checkpoint = "checkpoint.pytest_plugin"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "checkpoint.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["checkpoint*"]

[tool.setuptools.package-data]
"checkpoint" = ["py.typed", "init_templates/*"]
"checkpoint.dashboard" = ["static/**/*", "static/index.html"]
"checkpoint.init_templates" = ["**/*"]
"checkpoint.proxy" = ["Dockerfile", "entrypoint.sh"]
"checkpoint.demo" = ["*.py", "*.md"]
# Named twin seeds (`seed: small-project`) are read at runtime from
# checkpoint/twins/<twin>_seeds/<name>.json — they must ship in the wheel or
# every seeded scenario 404s on a pip-only install.
"checkpoint.twins" = ["*_seeds/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["checkpoint/dashboard/web", "packages"]

[tool.ruff.lint]
# Curated for signal over style: real bugs (F), import hygiene (I), likely
# defects (B), and modern-Python upgrades (UP), plus the syntax/statement subset
# of pycodestyle. E501 (line length) is deliberately NOT selected — this
# codebase uses long explanatory lines and reflowing them would churn every file
# for no correctness gain.
select = ["F", "I", "B", "UP", "E4", "E7", "E9"]
ignore = [
    # Deliberate: several modules import after runtime setup (e.g. lazy/optional
    # imports inside the CLI) rather than at the top.
    "E402",
    # Compact one-line guards are used intentionally in a few places.
    "E702",
    # Single-letter names are idiomatic in the small numeric/statistics helpers.
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately shadow and re-import fixtures.
"tests/**" = ["B011"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# --strict-markers turns a typo'd marker into an error instead of a silent
# no-op; --strict-config does the same for this table. --durations surfaces the
# slowest tests so the suite's cost stays visible.
addopts = "-ra --strict-markers --strict-config --durations=10"
asyncio_mode = "strict"
# The suite spawns uvicorn subprocesses and opens MCP sessions; without a bound,
# one hung call hangs the whole run (and the CI job) until the job timeout.
timeout = 300
timeout_method = "thread"
markers = [
    "slow: takes more than a second or two",
    "integration: spawns a real twin subprocess or MCP session",
    "docker: requires a working Docker daemon",
]

[tool.coverage.run]
source = ["checkpoint"]
branch = true
omit = [
    "checkpoint/demo/*",
    "checkpoint/init_templates/*",
    "checkpoint/dashboard/web/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
