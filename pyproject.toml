[project]
name = "checkpoint"
version = "0.1.0"
description = "Agent testing against stateful SaaS twins"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "mitmproxy>=10.0",
    "docker>=7.0",
    "mcp>=1.27",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
sdk = []

[project.scripts]
checkpoint = "checkpoint.cli:main"

[project.entry-points."pytest11"]
checkpoint = "checkpoint.pytest_plugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["checkpoint*"]

[tool.setuptools.package-data]
"checkpoint" = ["init_templates/*"]
"checkpoint.dashboard" = ["static/**/*", "static/index.html"]
"checkpoint.init_templates" = ["**/*"]
