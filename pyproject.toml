[project]
name = "checkpoint-agents"
version = "0.1.0"
description = "The pre-production release gate for AI agents: simulate against stateful SaaS twins, score full trajectories, gate every build."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Checkpoint Labs", email = "hello@usecheckpoint.dev" }]
keywords = ["ai", "agents", "testing", "evaluation", "llm", "red-teaming", "ci", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "openai>=1.30",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "mitmproxy>=10.0",
    "docker>=7.0",
    "mcp>=1.27",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
sdk = []
# Judge/parse with Claude models (claude-*). Gemini (gemini-*) and any
# OpenAI-compatible endpoint need no extra — they reuse the OpenAI client.
anthropic = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://usecheckpoint.dev"
Repository = "https://github.com/Aaditya2605/checkpoint"
Documentation = "https://usecheckpoint.dev/docs"
Issues = "https://github.com/Aaditya2605/checkpoint/issues"

[project.scripts]
checkpoint = "checkpoint.cli:main"

[project.entry-points."pytest11"]
checkpoint = "checkpoint.pytest_plugin"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["checkpoint*"]

[tool.setuptools.package-data]
"checkpoint" = ["init_templates/*"]
"checkpoint.dashboard" = ["static/**/*", "static/index.html"]
"checkpoint.init_templates" = ["**/*"]
"checkpoint.proxy" = ["Dockerfile", "entrypoint.sh"]
