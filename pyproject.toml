[project]
name = "checkpoint"
version = "0.0.1"
description = "Agent testing against stateful SaaS twins"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "openai>=1.30",
    "python-dotenv>=1.0",
]

[project.scripts]
checkpoint = "checkpoint.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["checkpoint*"]
